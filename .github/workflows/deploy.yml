name: Deploy to Azure

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate model loads
        run: |
          python -c "
          import joblib
          from pathlib import Path
          p = Path('models/xgboost_v2.pkl')
          if p.exists():
              a = joblib.load(p)
              assert 'model' in a
              assert 'feature_names' in a
              print(f'Model OK: {a[\"version\"]}, {len(a[\"feature_names\"])} features')
          else:
              print('No model file; skipping')
          "

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/webapps-deploy@v3
        with:
          app-name: solar-forecast-s01
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
